<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; padding: 20px; background: #fafafa; }
        form { max-width: 300px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 8px rgba(0,0,0,0.1);}
        input { width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;}
        button { width: 100%; padding: 10px; background-color: #007bff; border: none; color: white; font-size: 1rem; border-radius: 5px; cursor: pointer;}
        button:hover { background-color: #0056b3;}
        .msg { color: red; margin-bottom: 10px; }
    </style>
</head>
<body>
    <form method="POST">
        <h2>修改密码</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="msg">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        <input type="password" name="old_password" placeholder="旧密码" required>
        <input type="password" name="new_password" placeholder="新密码" required>
        <input type="password" name="confirm_password" placeholder="确认新密码" required>
        <button type="submit">确认修改</button>
        <p><a href="{{ url_for('index') }}">返回首页</a></p>
    </form>
</body>
</html>
