<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>设置头像</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; padding: 20px; background: #fafafa; }
        form { max-width: 300px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 8px rgba(0,0,0,0.1);}
        input, button { width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;}
        button { background-color: #007bff; color: white; border: none; cursor: pointer;}
        button:hover { background-color: #0056b3;}
        .msg { color: red; margin-bottom: 10px; }
        .preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
    </style>
</head>
<body>
    <form method="POST" enctype="multipart/form-data">
        <h2>设置头像</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="msg">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <label>选择头像：</label>
        <input type="file" name="avatar" accept="image/*" onchange="previewImg(event)">
        <img id="preview" class="preview" style="display:none;">

        <button type="submit">上传</button>
        <p><a href="{{ url_for('index') }}">返回首页</a></p>
    </form>

    <script>
        function previewImg(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = document.getElementById('preview');
                    img.src = ev.target.result;
                    img.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
