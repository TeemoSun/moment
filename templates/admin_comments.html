<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <title>评论管理</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        button {
            padding: 5px 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #c82333;
        }
        .btn-back {
            display: inline-block;
            padding: 8px 15px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .btn-back:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <h1>评论管理</h1>
    <a href="{{ url_for('admin_dashboard') }}" class="btn-back">返回后台首页</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>评论内容</th>
                <th>时间</th>
                <th>说说ID</th>
                <th>父评论ID</th>  <!-- 新增父评论ID列 -->
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for comment in comments %}
            <tr>
                <td>{{ comment[0] }}</td>
                <td>{{ comment[3] }}</td>
                <td>{{ comment[1] }}</td>
                <td>{{ comment[2] }}</td>
                <td>{{ comment[4] }}</td>
                <td>{{ comment[5] if comment[5] else '--' }}</td>
                <td>
                    <form action="{{ url_for('admin_delete_comment', comment_id=comment[0]) }}" method="POST" onsubmit="return confirm('确定删除该评论？')">
                        <button type="submit">删除</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
