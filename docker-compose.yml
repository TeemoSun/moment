services:
  db:
    image: postgres:16
    container_name: moments-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-moments}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-moments}
      - POSTGRES_DB=${POSTGRES_DB:-moments}
    expose:
      - "5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moments} -d ${POSTGRES_DB:-moments}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  moments:
    build: .
    container_name: moments
    ports:
      - "${MOMENTS_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./storage:/app/storage
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DB_URL=postgresql+psycopg://${POSTGRES_USER:-moments}:${POSTGRES_PASSWORD:-moments}@db:5432/${POSTGRES_DB:-moments}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped